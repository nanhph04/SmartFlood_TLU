version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  fuseki:
    image: stain/jena-fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    volumes:
      - ./fuseki:/fuseki
    environment:
      - ADMIN_PASSWORD=admin

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./ml:/app
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  node_modules_frontend:
  node_modules_backend:
