version: "3.8"

services:
  frontend:
    build:
      context: ./SmartFloodCity_FE
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./SmartFloodCity_FE:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  fuseki:
    image: stain/jena-fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    volumes:
      - ./fuseki:/fuseki
    environment:
      - ADMIN_PASSWORD=admin

  mongo:
    image: mongo:4.4
    container_name: mongo-orion
    ports:
      - "27017:27017"

  orion-ld:
    image: fiware/orion-ld
    container_name: orion-ld
    depends_on:
      - mongo
    ports:
      - "1026:1026"
    environment:
      - ORIONLD_MONGO_HOST=mongo

volumes:
  node_modules_frontend:
  node_modules_backend:
